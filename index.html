<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Jaxx AI — Mobile</title>
  <style>
    :root{--bg:#071326;--surface:#0b1724;--muted:#94a3b8;--accent:#06b6d4;--accent-2:#60a5fa;--card:#0e1a2b}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#e6eef6;background:linear-gradient(180deg,#031123 0%,#071326 100%)}

    /* App frame mimics a phone */
    .phone{width:100%;max-width:420px;margin:1.25rem auto;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,var(--surface),#071226);box-shadow:0 20px 60px rgba(2,6,23,0.6);min-height:720px;border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column}

    /* Top bar */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(90deg,rgba(255,255,255,0.015),transparent);backdrop-filter:blur(6px)}

    .brand{display:flex;gap:10px;align-items:center}
    .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .brand h1{font-size:18px;margin:0;letter-spacing:0.2px}
    .tiny-muted{font-size:12px;color:var(--muted)}

    /* Shell with two-pane windows (list + chat) on larger screens, stacked on small */
    .shell{flex:1;display:grid;grid-template-columns:1fr;gap:0}
    @media(min-width:800px){.shell{grid-template-columns:280px 1fr}}

    /* Conversations list */
    .list-panel{background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);padding:10px;border-right:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:8px}
    .list-search{display:flex;gap:8px;padding:8px}
    .search{flex:1;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .new-chat{background:var(--accent);color:#021;border:none;padding:8px 10px;border-radius:10px}

    .convo-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}
    .convo-item:hover{background:rgba(255,255,255,0.01)}
    .avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(90deg,var(--accent-2),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#012}
    .convo-meta{flex:1;display:flex;flex-direction:column}
    .convo-meta .title{font-weight:600}
    .convo-meta .sub{font-size:12px;color:var(--muted);margin-top:4px}

    /* Chat panel */
    .chat-panel{display:flex;flex-direction:column;height:100%}
    .chat-window{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
    .bubble{max-width:78%;padding:10px 12px;border-radius:14px;line-height:1.3;word-break:break-word}
    .bubble.user{align-self:flex-end;background:linear-gradient(90deg,#0369a1,#06b6d4);color:white;border-bottom-right-radius:6px}
    .bubble.bot{align-self:flex-start;background:linear-gradient(90deg,#071426,#0b1730);color:#dbeafe;border:1px solid rgba(255,255,255,0.02);border-bottom-left-radius:6px}
    .meta-line{font-size:11px;color:var(--muted);margin-top:6px}

    /* Multiple windows: small floating cards to represent windows */
    .floating-windows{position:relative}
    .mini-window{position:absolute;right:16px;top:16px;width:160px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;padding:8px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.4)}

    /* Composer fixed at bottom like a phone app */
    .composer-bar{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.02);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.12))}
    .input{flex:1;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);resize:none;color:inherit}
    .send-btn{background:var(--accent);color:#012;border:none;padding:10px 12px;border-radius:12px}
    .attach{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:10px;color:var(--muted)}

    /* Bottom nav for mobile */
    .bottom-nav{display:flex;justify-content:space-around;padding:8px;border-top:1px solid rgba(255,255,255,0.02);background:linear-gradient(180deg,rgba(0,0,0,0.06),transparent)}
    .nav-btn{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:6px;padding:6px}
    .nav-btn.active{color:var(--accent)}

    /* Panels inside settings window */
    .settings-panel{padding:12px;display:flex;flex-direction:column;gap:10px}
    .row{display:flex;gap:8px;align-items:center}

    /* Modal/fullscreen settings for mobile */
    .modal{position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,6,23,0.75),rgba(2,6,23,0.85));display:flex;align-items:center;justify-content:center;z-index:80}
    .modal-card{width:92%;max-width:420px;background:var(--card);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,0.03)}

    /* Small helpers */
    .muted{color:var(--muted)}
    .badge{background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:10px;font-size:12px}
    .hidden{display:none}

  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="Jaxx AI mobile app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <h1>Jaxx AI</h1>
          <div class="tiny-muted">Smart mobile assistant</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="openSettingsBtn" class="attach">⚙️</button>
        <button id="newChatBtn" class="new-chat">New</button>
      </div>
    </div>

    <div class="shell">
      <aside class="list-panel" id="listPanel">
        <div class="list-search">
          <input id="search" class="search" placeholder="Search chats or prompts" />
          <button id="newMobileChat" class="new-chat">+</button>
        </div>
        <div id="convoList" style="overflow:auto;padding:6px;">
          <!-- conversation items inserted here -->
        </div>
      </aside>

      <section class="chat-panel">
        <div class="chat-window" id="chat">
          <!-- messages -->
        </div>

        <div class="composer-bar">
          <button id="attach" class="attach">＋</button>
          <textarea id="input" class="input" rows="1" placeholder="Message Jaxx…"></textarea>
          <button id="send" class="send-btn">Send</button>
        </div>

        <div class="bottom-nav">
          <div class="nav-btn active" data-view="chats">💬<div>Chats</div></div>
          <div class="nav-btn" data-view="explore">🔎<div>Explore</div></div>
          <div class="nav-btn" data-view="settings">⚙️<div>Settings</div></div>
        </div>

      </section>
    </div>
  </div>

  <!-- Floating mini windows example (multiple windows look) -->
  <div class="floating-windows">
    <div id="mini1" class="mini-window" style="top:110px;right:18px">Saved prompts<div class="muted" style="font-size:12px;margin-top:6px">"Quick intro"</div></div>
    <div id="mini2" class="mini-window" style="top:220px;right:18px">Shortcuts<div class="muted" style="font-size:12px;margin-top:6px">Cmd+K to search</div></div>
  </div>

  <!-- Modal: Settings -->
  <div id="settingsModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>Settings</strong>
        <button id="closeSettings" class="attach">✖</button>
      </div>
      <div class="settings-panel">
        <div>
          <label class="muted">Mode</label>
          <div style="display:flex;gap:8px;margin-top:6px">
            <button class="mode active" data-mode="echo">Echo</button>
            <button class="mode" data-mode="rules">Rule</button>
            <button class="mode" data-mode="api">API</button>
          </div>
        </div>

        <div>
          <label class="muted">API endpoint</label>
          <input id="api-url" type="text" placeholder="https://your-proxy.example/chat" />
        </div>

        <div>
          <label class="muted">Header (name:value)</label>
          <input id="api-header" type="text" placeholder="X-Client-Key: bbavjwbx" />
        </div>

        <div style="display:flex;gap:8px">
          <button id="testApiBtn" class="new-chat">Test</button>
          <button id="saveSettings" class="attach">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Data models (simple in-memory) — in future this can be persisted per user
    const convoListEl = document.getElementById('convoList');
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const searchEl = document.getElementById('search');
    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettings');
    const apiUrlInput = document.getElementById('api-url');
    const apiHeaderInput = document.getElementById('api-header');
    const testApiBtn = document.getElementById('testApiBtn');

    let conversations = [];
    let selectedId = null;
    let mode = 'echo';

    function nowISO(){return new Date().toISOString()}
    function shortTs(iso){return new Date(iso).toLocaleTimeString()}

    function renderConvoList(filter=''){
      convoListEl.innerHTML='';
      conversations.forEach(c=>{
        if(filter && !c.title.toLowerCase().includes(filter.toLowerCase())) return;
        const item = document.createElement('div'); item.className='convo-item'; item.dataset.id=c.id;
        item.innerHTML = `<div class='avatar'>${c.title.slice(0,2).toUpperCase()}</div><div class='convo-meta'><div class='title'>${escapeHtml(c.title)}</div><div class='sub'>${escapeHtml(c.last || '')}</div></div>`;
        item.addEventListener('click', ()=>selectConversation(c.id));
        convoListEl.appendChild(item);
      });
      if(conversations.length===0){
        const p = document.createElement('div'); p.className='muted'; p.style.padding='12px'; p.textContent='No conversations yet — tap New to start'; convoListEl.appendChild(p);
      }
    }

    function createConversation(title){
      const id = 'c_'+Math.random().toString(36).slice(2,9);
      const c = { id, title: title || 'New chat', messages: [], last: '' };
      conversations.unshift(c);
      renderConvoList();
      selectConversation(id);
    }

    function selectConversation(id){
      selectedId = id;
      const c = conversations.find(x=>x.id===id);
      if(!c) return;
      renderChat(c);
    }

    function renderChat(c){
      chatEl.innerHTML='';
      c.messages.forEach(m=>{
        const b = document.createElement('div'); b.className='bubble '+(m.role==='user'?'user':'bot');
        b.innerHTML = escapeHtml(m.text) + `<div class='meta-line'>${shortTs(m.ts)}</div>`;
        chatEl.appendChild(b);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendMessageToCurrent(role,text){
      if(!selectedId) createConversation('Chat');
      const c = conversations.find(x=>x.id===selectedId);
      const m = { role, text, ts: nowISO() };
      c.messages.push(m); c.last = text.slice(0,48);
      renderChat(c); renderConvoList();
    }

    function escapeHtml(s){ return s.replace(/[&<>\"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]}); }

    // Composer
    sendBtn.addEventListener('click', ()=>{ const txt = inputEl.value.trim(); if(!txt) return; appendMessageToCurrent('user', txt); inputEl.value=''; handleSend(txt); });
    inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); }});

    // New chat
    document.getElementById('newChatBtn').addEventListener('click', ()=>createConversation('New Chat'));
    document.getElementById('newMobileChat').addEventListener('click', ()=>createConversation('New Chat'));

    // Search
    searchEl.addEventListener('input',(e)=>renderConvoList(e.target.value));

    // Settings modal
    openSettingsBtn.addEventListener('click', ()=>{ settingsModal.classList.remove('hidden'); settingsModal.setAttribute('aria-hidden','false'); });
    closeSettingsBtn.addEventListener('click', ()=>{ settingsModal.classList.add('hidden'); settingsModal.setAttribute('aria-hidden','true'); });

    // Modes inside modal
    document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click', ()=>{
      document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); mode = b.dataset.mode || 'echo';
    }));

    // API test
    testApiBtn.addEventListener('click', async ()=>{
      const url = apiUrlInput.value.trim(); const header = apiHeaderInput.value.trim();
      if(!url) return alert('Enter API URL');
      try{
        const headers = {'Content-Type':'application/json'};
        if(header){
          const parts = header.split(':'); if(parts.length>=2) headers[parts[0].trim()] = parts.slice(1).join(':').trim();
        }
        const res = await fetch(url,{method:'POST',headers,body:JSON.stringify({message:'ping'})});
        const data = await res.json();
        alert('Success — provider replied: '+(data.reply || JSON.stringify(data).slice(0,100)));
      }catch(err){ alert('API test failed: '+err.message); }
    });

    // Basic send handler that supports echo / rule-based / api (proxy) modes
    async function handleSend(text){
      if(mode==='echo'){ setTimeout(()=>appendMessageToCurrent('bot','Echo: '+text), 300 + Math.random()*300); return; }
      if(mode==='rules'){ setTimeout(()=>{ const t=text.toLowerCase(); if(/hello|hi|hey\b/.test(t)) appendMessageToCurrent('bot','Hello!'); else if(/time/.test(t)) appendMessageToCurrent('bot','Current time: '+new Date().toLocaleString()); else if(/joke/.test(t)) appendMessageToCurrent('bot','Why did the developer go broke? He used up all his cache. 😄'); else appendMessageToCurrent('bot','I did not understand. Try help.'); }, 400); return; }

      // API mode
      const url = apiUrlInput.value.trim(); const header = apiHeaderInput.value.trim();
      if(!url){ appendMessageToCurrent('bot','API URL not set in Settings.'); return; }
      // show temporary typing bubble
      const typing = { role:'bot', text:'Jaxx is thinking...', ts: nowISO() };
      appendMessageToCurrent('bot', typing.text);

      try{
        const headers = {'Content-Type':'application/json'};
        if(header){ const parts = header.split(':'); if(parts.length>=2) headers[parts[0].trim()] = parts.slice(1).join(':').trim(); }
        const res = await fetch(url, { method:'POST', headers, body: JSON.stringify({ message: text, history: conversations.find(x=>x.id===selectedId)?.messages || [] }) });
        if(!res.ok) throw new Error('API error '+res.status);
        const data = await res.json();
        const reply = data.reply || (data.choices && data.choices[0] && (data.choices[0].message?.content || data.choices[0].text)) || JSON.stringify(data);
        // remove last typing and append actual reply
        const c = conversations.find(x=>x.id===selectedId); if(c && c.messages.length) c.messages.pop();
        appendMessageToCurrent('bot', reply);
      }catch(err){
        const c = conversations.find(x=>x.id===selectedId); if(c && c.messages.length) c.messages.pop();
        appendMessageToCurrent('bot','API error: '+err.message);
      }
    }

    // Small demo: preload a conversation
    (function init(){
      createConversation('Welcome');
      appendMessageToCurrent('bot','Welcome to Jaxx AI — tap New to start a chat');
      renderConvoList();
    })();

  </script>
</body>
</html>
